<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .red{
            background-color: #e40a0a;
        }
        #green{
            background-color: rgb(43, 118, 43);
        }
    </style>
    <title>class and ID in HTML</title>
</head>
<body>
    
    <!-- class can be multiple but the id should be one and unique -->
    <p class="red">Lorem ipsum dolor sit amet consectetur adipisicing elit. Et, quos!</p>
    <p id="green">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Blanditiis, voluptatem?</p>
    <h1 class="red">Test 1</h1>
    <h2 id="green">Test 2</h2>
</body>
</html>
