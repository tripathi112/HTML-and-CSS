<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframes in HTML</title>
    <style>
        body{
            text-align: center;
            background-color: #000;
            color:#ffffff;
        }
        table{
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th,td{
            padding: 1px;
            border: 1px solid #ffffff;
        }
    </style>
</head>
<body>
    
    <!-- iframe represents a nesting browsing context and loads another web page or HTMl page in our current page -->
     <h1>How iframe works in HTML</h1>
<h2>iframe represents a nesting browsing context and loads another web page or HTMl page in our current page</h2>
<h3>Here YouTube videos are playing in my current page</h3>
     <table>
        <tr>
            <th>Shiv Song</th>
            <td>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/Onb6_bRJ0Bw?si=suyqsjA9ab9dZ_t7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </td>
        </tr>
        <tr>
            <th>my fav song video</th>
            <td>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/03E-KkHOtFI?si=zxRB5BRbL6LYpJW7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </td>
        </tr>
     </table>
</body>
</html>
