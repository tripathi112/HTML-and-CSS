<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists, Inline elements and block elements n HTML</title>
</head>
<body>
    <h1 style="text-align: center;">List in HTML</h1>
    <h2>1. Unorderd list</h2>
    <ul>
    <!-- <ul style="list-style-type: circle;"> -->
        <li>1</li>
        <!-- nested list -->
         <ol type="A">
            <li>heading one</li>
            <li>heading two</li>
         </ol>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
    </ul>

    <h2>2. Ordered list</h2>
    <ol>
        <li>name</li>
        <li>age</li>
        <li>phone</li>
    </ol>

    <h2>3. Data List</h2>
    <dl>
        <!-- data topic -->
        <dt>Tea</dt>  
            <!--data description  -->
        <dd>lemon tea</dd>
        <dd>ice tea</dd>
        <dd>green tea</dd>
    </dl>

    <!-- inline and block elements -->
    <h3>Test 1</h3>
    <p>Test 2</p>
     <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Explicabo, quidem. <span>test3</span></p>
</body>
</html>
